        lambda_india: {value: 0.25, low: 0.10, high: 0.40}
      "12M":
        c: {value: 0.35, low: 0.20, high: 0.60}
        lambda: {value: 0.60, low: 0.35, high: 0.85}
        ds_bps: {value: 500, low: 250, high: 1000}
