# =====================================================================================
# AI CRASH MONITOR — universe definition (the single driver of build_data.py)
# -------------------------------------------------------------------------------------
# * Add/remove a company, tier, parent or shock origin here; no code changes needed.
# * Every non-computed number carries `status`:
#     SOURCED          -> cited in `sources:` (id in `src:`), verbatim quote stored
#     UNVERIFIED       -> single weak/secondary source, conflicting sources, or unconfirmed
#     USER_ASSUMPTION  -> no source; a declared model default (exposed as a slider)
#   Quantities may have several multiplicative `parts`; value = product of parts and the
#   effective status is the worst part (USER_ASSUMPTION > UNVERIFIED > SOURCED > COMPUTED).
# * A part may use `value_from:` instead of `value:` for pipeline-computed inputs
#   (supported: inv_revenue_ttm_cr = 1 / trailing-12m revenue in INR crore).
# * All scenarios built from this file are HYPOTHETICAL. Educational model, not advice.
# =====================================================================================
version: 1
includes: [history.yaml]          # written by the history stream; optional

settings:
  app: AI CRASH MONITOR
  regression_years: 3
  history_start: "2015-01-01"
  pre_chatgpt_date: "2022-11-30"  # ChatGPT public launch (src: openai_chatgpt)
  pre_chatgpt_src: [openai_chatgpt]
  pre_chatgpt_window_years: 3
  pre_chatgpt_min_obs: 250
  downside_quantile: 0.05
  downside_min_obs: 25
  rolling_window: 252
  rolling_step: 5
  rolling_min_obs: 200
  hac_lags: 5
  mc_runs: 5000
  inr_crore: 10000000
  op_leverage_min: 1.0
  op_leverage_max: 4.0
  op_leverage_min_rev_change: 0.02
  op_leverage_default: 1.5         # USER_ASSUMPTION fallback when statements are unusable
  fundamentals_cache_days: 3
  earnings_dates_limit: 80

# Exchange close times drive the information-set alignment (DESIGN.md §3.2).
# Only the ordering relative to the NSE close (15:30 IST) matters for the lag structure.
markets:
  IN: {tz: Asia/Kolkata, close: "15:30"}
  US: {tz: America/New_York, close: "16:00"}
  JP: {tz: Asia/Tokyo, close: "15:30", close_before: {"2024-11-05": "15:00"}, src: [jpx_trading_hours]}
  DE: {tz: Europe/Berlin, close: "17:30"}
  CH: {tz: Europe/Zurich, close: "17:30"}
  FR: {tz: Europe/Paris, close: "17:30"}
  FX: {tz: Europe/London, close: "22:00"}   # Yahoo FX daily bar; ordering only (after NSE close)

factors:
  - {id: SOX, ticker: "^SOX", name: "PHLX Semiconductor Index", market: US}
  - {id: NDX, ticker: "^NDX", name: "Nasdaq-100", market: US}
  - {id: SPX, ticker: "^GSPC", name: "S&P 500", market: US}
  - {id: VIX, ticker: "^VIX", name: "CBOE Volatility Index", market: US, kind: level}
  - {id: USDINR, ticker: "USDINR=X", name: "USD/INR", market: FX, kind: fx}
  - {id: NIFTY, ticker: "^NSEI", name: "Nifty 50", market: IN}
  - {id: NIFTYIT, ticker: "^CNXIT", name: "Nifty IT", market: IN}

# Currency conversion series (latest close). quote: per_usd = units of currency per 1 USD.
fx_rates:
  INR: {ticker: "USDINR=X", quote: per_usd}
  JPY: {ticker: "JPY=X", quote: per_usd}
  EUR: {ticker: "EURUSD=X", quote: usd_per}
  CHF: {ticker: "CHF=X", quote: per_usd}
  TWD: {ticker: "TWD=X", quote: per_usd}

