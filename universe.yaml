# -------------------------------------------------------------------------------------
# GLOBAL MODEL ASSUMPTIONS (all USER_ASSUMPTION unless sourced)
# -------------------------------------------------------------------------------------
assumptions:
  - {id: assump.psi_supplier, label: "Pass-through of a capex cut to AI-supplier revenue", value: 1.0, unit: x, status: USER_ASSUMPTION, min: 0, max: 1.5, step: 0.05, note: "1.0 = suppliers lose revenue in proportion to the capex cut"}
  - {id: assump.phi_it, label: "IT-services budget elasticity to US tech client revenue shock", value: 1.0, unit: x, status: USER_ASSUMPTION, min: 0, max: 2, step: 0.05}
  - {id: assump.psi_india_dc, label: "Pass-through of US AI capex cut to Indian capex-order exposures", value: 0.5, unit: x, status: USER_ASSUMPTION, min: 0, max: 1.5, step: 0.05, note: "Indian DC/AI demand is partly domestic"}
  - {id: assump.kappa_capex, label: "Growth-reset de-rating per unit EPS cut (capex shock)", value: 0.0, unit: x, status: USER_ASSUMPTION, min: 0, max: 1.5, step: 0.05}
  - {id: assump.kappa_guidance, label: "Growth-reset de-rating per unit EPS cut (guidance shock)", value: 0.5, unit: x, status: USER_ASSUMPTION, min: 0, max: 1.5, step: 0.05}
  - {id: assump.sympathy, label: "Peer sympathy multiplier on normal-times peer beta", value: 1.0, unit: x, status: USER_ASSUMPTION, min: 0, max: 2, step: 0.05}
  - {id: assump.credit_duration, label: "Debt duration used to capitalise a spread shock", value: 5.0, unit: yrs, status: USER_ASSUMPTION, min: 1, max: 10, step: 0.5}
  - {id: assump.op_leverage_default, label: "Fallback operating leverage when statements are unusable", value: 1.5, unit: x, status: USER_ASSUMPTION, min: 1, max: 4, step: 0.1}
  - {id: assump.premium_fallback, label: "AI premium fallback when no pre-ChatGPT P/E exists", value: 1.0, unit: x, status: USER_ASSUMPTION, note: "1.0 = use the tier median AI premium"}

# -------------------------------------------------------------------------------------
# SHOCK PRESETS (F1). Param keys are fixed by docs/DESIGN.md §4.1.
# Every default and Monte Carlo bound is a USER_ASSUMPTION unless stated.
# mc: triangular(low, mode=value, high) | uniform(low, high) | fixed
# -------------------------------------------------------------------------------------
presets:
  - id: capex
    num: 1
    label: "Hyperscaler capex cut"
    description: "c% cut to the combined AI capex of MSFT, GOOGL, AMZN, META, ORCL; flows to suppliers via their hyperscaler revenue share and operating leverage, then to India."
    params:
      - {key: c, label: "Capex cut c", kind: number, value: 0.30, min: 0, max: 0.8, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.15, high: 0.50}}
      - {key: psi_supplier, label: "Supplier pass-through psi", kind: number, value: 1.0, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: kappa, label: "Growth de-rating per EPS cut kappa", kind: number, value: 0.0, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: phi_it, label: "IT budget elasticity phi", kind: number, value: 1.0, min: 0, max: 2, step: 0.05, unit: x, mc: {dist: triangular, low: 0.5, high: 1.5}}
      - {key: psi_india_dc, label: "India capex-order pass-through", kind: number, value: 0.5, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: triangular, low: 0.25, high: 1.0}}
      - &lambda_india0 {key: lambda_india, label: "India AI-premium unwind", kind: number, value: 0.0, min: 0, max: 1, step: 0.05, unit: frac, mc: {dist: fixed}}
      - &f_override {key: f_override, label: "INR depreciation f (blank = auto from beta)", kind: number, value: null, min: 0, max: 0.2, step: 0.005, unit: frac, mc: null}

  - id: guidance
    num: 2
    label: "Chipmaker guidance cut"
    description: "Pick any chip name; its revenue is guided down g%. EPS falls by g x operating leverage, the multiple de-rates by kappa x EPS cut, peers move by their peer beta."
    params:
      - {key: target, label: "Chipmaker", kind: ticker, value: NVDA, options: [NVDA, AMD, AVGO, TSM, ASML, MU, INTC, ARM, MRVL, SMCI]}
      - {key: g, label: "Guided revenue cut g", kind: number, value: 0.20, min: 0, max: 0.8, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.10, high: 0.35}}
      - {key: kappa, label: "Growth de-rating per EPS cut kappa", kind: number, value: 0.5, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: triangular, low: 0.25, high: 0.75}}
      - {key: sympathy, label: "Peer sympathy multiplier", kind: number, value: 1.0, min: 0, max: 2, step: 0.05, unit: x, mc: {dist: triangular, low: 0.5, high: 1.25}}
      - {key: phi_it, label: "IT budget elasticity phi", kind: number, value: 1.0, min: 0, max: 2, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: psi_india_dc, label: "India capex-order pass-through", kind: number, value: 0.5, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - *lambda_india0
      - *f_override

  - id: restatement
    num: 3
    label: "Accounting restatement"
    description: "Profit at any chosen company (origin or Indian target) restated down r%, plus a credibility de-rating d; peers in the same group/tier move by the calibrated contagion ratio."
    params:
      - {key: target, label: "Company", kind: ticker, value: SMCI, options: null, note: "any origin or India target"}
      - {key: r, label: "Profit restated down r", kind: number, value: 0.30, min: 0, max: 1, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.15, high: 0.50}}
      - {key: d, label: "Credibility de-rating d", kind: number, value: 0.25, min: 0, max: 0.9, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.10, high: 0.40}}
      - {key: contagion, label: "Contagion ratio (blank = calibrated)", kind: number, value: null, min: 0, max: 1, step: 0.01, unit: x, mc: null, note: "default: calib.contagion_us (SMCI 2024) or calib.contagion_india (Satyam 2009)"}
      - *lambda_india0
      - *f_override

  - id: multiple
    num: 4
    label: "Pure multiple compression"
    description: "Earnings unchanged. The AI-basket P/E reverts toward its pre-ChatGPT (before 30-Nov-2022) median by lambda, or to a user-set multiple."
    params:
      - {key: mode, label: "Target", kind: enum, value: median, options: [median, multiple, calibrated], note: "median = revert toward the AI basket's own pre-ChatGPT median P/E (user's literal spec; if today's basket P/E is already below that median this implies no compression); multiple = user-set basket P/E; calibrated = lambda x drawdown implied by the history P/E-vs-drawdown fit (history.pe_fit) at today's basket P/E"}
      - {key: lambda, label: "Reversion fraction lambda", kind: number, value: 0.5, min: 0, max: 1, step: 0.05, unit: frac, mc: {dist: triangular, low: 0.25, high: 0.80}}
      - {key: target_pe, label: "User-set basket P/E", kind: number, value: 25, min: 5, max: 80, step: 0.5, unit: x, mc: {dist: fixed}}
      - {key: per_name, label: "Per-name medians", kind: bool, value: false}
      - {key: floor_zero, label: "Compression only (floor at 0)", kind: bool, value: true}
      - {key: lambda_india, label: "India AI-premium unwind", kind: number, value: 0.5, min: 0, max: 1, step: 0.05, unit: frac, mc: {dist: triangular, low: 0.25, high: 0.80}}
      - *f_override

  - id: credit
    num: 5
    label: "AI credit event"
    description: "LOW CONFIDENCE. Neocloud / AI-debt stress: spreads widen on stressed borrowers (CRWV, ORCL), equity absorbs the capitalised extra interest plus a de-rating, and stressed borrowers cut capex by k, hitting suppliers via their neocloud share."
    low_confidence: true
    params:
      - {key: ds_bps, label: "Spread widening", kind: number, value: 400, min: 0, max: 1500, step: 25, unit: bps, mc: {dist: triangular, low: 200, high: 800}}
      - {key: duration, label: "Debt duration", kind: number, value: 5, min: 1, max: 10, step: 0.5, unit: yrs, mc: {dist: fixed}}
      - {key: k, label: "Stressed-borrower capex cut k", kind: number, value: 0.30, min: 0, max: 0.8, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.15, high: 0.50}}
      - {key: d_credit, label: "Credit de-rating", kind: number, value: 0.15, min: 0, max: 0.6, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.05, high: 0.30}}
      - {key: psi_supplier, label: "Supplier pass-through psi", kind: number, value: 1.0, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: phi_it, label: "IT budget elasticity phi", kind: number, value: 1.0, min: 0, max: 2, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: psi_india_dc, label: "India capex-order pass-through", kind: number, value: 0.5, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - *lambda_india0
      - *f_override

  - id: replay
    num: 6
    label: "Historical replay"
    description: "Apply the actual US factor moves (SOX, NDX) from a historical window to today's Indian universe using today's betas. Fundamental damage is not modelled."
    params:
      - {key: window, label: "Window", kind: window, value: DOTCOM, options: null, note: "ids from replay_windows"}
      - *f_override

  - id: fullpop
    num: 7
    label: "Full bubble pop"
    description: "Capex cut (1) + multiple compression (4) + AI credit event (5) over a chosen horizon. Horizon-specific defaults; LOW CONFIDENCE because it includes the credit leg."
    low_confidence: true
    params:
      - {key: c, label: "Capex cut c", kind: number, value: 0.35, min: 0, max: 0.8, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.20, high: 0.60}}
      - {key: psi_supplier, label: "Supplier pass-through psi", kind: number, value: 1.0, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: kappa, label: "Growth de-rating per EPS cut kappa", kind: number, value: 0.0, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: fixed}}
      - {key: phi_it, label: "IT budget elasticity phi", kind: number, value: 1.0, min: 0, max: 2, step: 0.05, unit: x, mc: {dist: triangular, low: 0.5, high: 1.5}}
      - {key: psi_india_dc, label: "India capex-order pass-through", kind: number, value: 0.5, min: 0, max: 1.5, step: 0.05, unit: x, mc: {dist: triangular, low: 0.25, high: 1.0}}
      - {key: mode, label: "Multiple target", kind: enum, value: calibrated, options: [median, multiple, calibrated], note: "USER_ASSUMPTION: full-pop default uses the calibrated mode (lambda x fit-implied drawdown at today's basket P/E) because the pre-ChatGPT-median target implies no compression when today's basket P/E is below it"}
      - {key: lambda, label: "Reversion fraction lambda (share of the fit-implied drawdown)", kind: number, value: 0.60, min: 0, max: 1, step: 0.05, unit: frac, mc: {dist: triangular, low: 0.35, high: 0.85}, note: "USER_ASSUMPTION; horizon defaults 1D 0.10 / 1M 0.30 / 12M 0.60"}
      - {key: target_pe, label: "User-set basket P/E", kind: number, value: 25, min: 5, max: 80, step: 0.5, unit: x, mc: {dist: fixed}}
      - {key: per_name, label: "Per-name medians", kind: bool, value: false}
      - {key: floor_zero, label: "Compression only (floor at 0)", kind: bool, value: true}
      - {key: ds_bps, label: "Spread widening", kind: number, value: 500, min: 0, max: 1500, step: 25, unit: bps, mc: {dist: triangular, low: 250, high: 1000}}
      - {key: duration, label: "Debt duration", kind: number, value: 5, min: 1, max: 10, step: 0.5, unit: yrs, mc: {dist: fixed}}
      - {key: k, label: "Stressed-borrower capex cut k", kind: number, value: 0.35, min: 0, max: 0.8, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.20, high: 0.60}}
      - {key: d_credit, label: "Credit de-rating", kind: number, value: 0.20, min: 0, max: 0.6, step: 0.01, unit: frac, mc: {dist: triangular, low: 0.10, high: 0.35}}
      - {key: lambda_india, label: "India AI-premium unwind", kind: number, value: 0.50, min: 0, max: 1, step: 0.05, unit: frac, mc: {dist: triangular, low: 0.25, high: 0.75}}
      - *f_override
    horizon_overrides:
      "1D":
        c: {value: 0.10, low: 0.05, high: 0.20}
        lambda: {value: 0.10, low: 0.05, high: 0.20}
        ds_bps: {value: 150, low: 75, high: 300}
