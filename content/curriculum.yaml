  - {id: pb-analytic-functions, stage: PB, title: "Analytic functions", summary: "Functions given by convergent power series, and their rigidity.", pre: [pb-complex-differentiation, l12-ca-analytic]}
  - {id: pb-analytic-continuation, stage: PB, title: "Analytic continuation", summary: "Extending a function beyond where its formula works - in only one possible way.", pre: [pb-analytic-functions, l12-ca-zeros-poles]}
  - {id: pb-zeta-function, stage: PB, title: "The zeta function", summary: "Riemann's zeta function, defined by a series and extended to the whole complex plane.", pre: [pb-analytic-continuation, pb-limits-convergence]}
  - {id: pb-euler-product, stage: PB, title: "Euler's product formula", summary: "The zeta function as a product over primes - the link between zeta and primes.", pre: [pb-zeta-function]}
  - {id: pb-functional-equation, stage: PB, title: "The functional equation", summary: "A symmetry relating zeta at s and at 1 - s.", pre: [pb-zeta-function, l12-ca-gamma-function]}
