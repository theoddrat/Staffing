      computed_moves: []

    - id: telecom
      name: "Telecom & fiber overbuild"
      period: "2000 – 2002"
      what_broke: "Carriers financed a fiber and equipment build-out with debt ahead of demand; when traffic and pricing disappointed, over-levered networks went bankrupt (Global Crossing, WorldCom), equipment orders collapsed and accounting fraud surfaced — the closest analogue to a data-centre / GPU glut financed with debt."
      crash_types: [capex_overbuild, credit_liquidity, fraud_trust]
