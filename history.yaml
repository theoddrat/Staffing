      label: "Nikkei 225, 1989"
      market: JP
      pe: 60
      pe_kind: trailing
      src: [hist_man_nikkei, hist_cme_nikkei]
      note: "Trailing 12-month P/E at the Dec-1989 peak (Man Group); CME cites ~71x."
      drawdown_from: {ticker: "^N225", peak_search: ["1989-06-01", "1990-03-31"], trough_end: "2012-12-31"}
    - id: ndx2000
      label: "Nasdaq-100, 2000"
      market: US
      pe: 104
      pe_kind: trailing
      src: [hist_nasdaq_ndx_pe]
      note: "Imputed index P/E at 31-Dec-1999 (index provider); the March-2000 peak P/E was higher."
      drawdown_from: {ticker: "^NDX", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
    - id: nifty2008
