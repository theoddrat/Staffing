  cases:
    - id: railway
      name: "British Railway Mania"
      period: "1844–1850"
      what_broke: "A promotion boom in new railway lines peaked in 1845; railway share indices then fell about 64% over roughly four and a half years (Odlyzko; Campbell). The analogy: capital committed to a build-out ahead of the revenue it would earn."
      crash_types: [capex_overbuild]
      linked: "Qualitative overbuild analogy only: the real assets (track) survived and were used; the equity that financed the build-out did not earn its expected return. Analogy to GPUs/data centres financed ahead of AI revenue."
      india: "No comparable listed Indian market; included for the overbuild analogy only."
      src: [hist_odlyzko_mania, hist_campbell_voxeu]
      drawdowns:
        - label: "Railway share index (Odlyzko)"
          src: [hist_odlyzko_mania]
          sourced: {peak_date: "1845 (summer)", peak: 167.9, trough_date: "1849 (end)", trough: 60.5, drawdown: -0.64}
          note: "Index levels as quoted; time to bottom ~4.5 years."
        - label: "All-railway index (Campbell)"
          src: [hist_campbell_voxeu]
          sourced: {peak_date: "1845-10 (early October)", peak: null, trough_date: "1850-04", trough: 741, drawdown: -0.641}
          note: "Base 1,000; peak level not quoted."
      computed_moves: []

    - id: dotcom
      name: "Dot-com bust"
      period: "Mar-2000 – Oct-2002"
      what_broke: "Internet and telecom-equipment valuations priced in growth that did not arrive; once customers stopped buying, the 'picks and shovels' (networking gear) suppliers saw multiple compression turn into an earnings collapse."
      crash_types: [multiple_compression, earnings_collapse, capex_overbuild]
      linked: "Cisco — the networking 'picks and shovels' of the internet build-out — is the closest analogue to Nvidia in the AI build-out; Intel and Qualcomm shown for breadth."
      india: "Indian IT exporters and the Ketan Parekh 'K-10' new-economy stocks fell with Nasdaq; Sify (Nasdaq ADR) and Zee are computed series, K-10 and HFCL figures are sourced because Yahoo has no prices for DSQ, Pentamedia or pre-2002 HFCL."
      src: [hist_icmr_k10, hist_outlook_hfcl, hist_moneylife_k10, hist_wiki_ketan, hist_yahoo]
      drawdowns:
        - {ticker: "^IXIC", label: "Nasdaq Composite", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "^NDX", label: "Nasdaq-100", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "^SOX", label: "PHLX Semiconductor", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "CSCO", label: "Cisco (picks & shovels)", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "INTC", label: "Intel", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "QCOM", label: "Qualcomm", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "^BSESN", label: "Sensex", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "INFY.NS", label: "Infosys (NSE)", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "WIPRO.NS", label: "Wipro (NSE)", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "INFY", label: "Infosys ADR", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "SIFY", label: "Sify ADR", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - {ticker: "ZEEL.BO", label: "Zee (BSE; series starts 2000-01-03)", peak_search: ["1999-10-01", "2000-12-31"], trough_end: "2003-06-30"}
        - label: "K-10 stocks (two months after Apr-2000)"
          src: [hist_icmr_k10]
          sourced: {peak_date: "2000-04", peak: null, trough_date: "2000-06", trough: null, drawdown: -0.67}
          note: "Same period: Sensex -23%, Nasdaq -35.9% (sourced)."
        - label: "HFCL (K-10) on 9-Mar-2001"
          src: [hist_outlook_hfcl]
          sourced: {peak_date: null, peak: null, trough_date: "2001-03-09", trough: 328, drawdown: null}
